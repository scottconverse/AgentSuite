name: test

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

concurrency:
  # Serialize per-ref runs of this workflow. cancel-in-progress is FALSE so a
  # mid-flight test run on a v* tag is not killed by a re-pushed tag. Jobs run
  # on GitHub-hosted ubuntu-latest runners, so test.yml and release.yml run
  # side by side. See CONTRIBUTING.md "Releases".
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Docs-only changes start no CI run (docs get push, merge and publish only).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is docs. Anything unknown counts as code.
          docs_re='(\.(md|mdx|rst|docx|pdf)$)|(^|/)(LICENSE|NOTICE)(\.[^/]*)?$|^docs/.*\.(png|jpe?g|svg|gif|webp|html|css)$'
          keep_re='(^|/)SKILL\.md$|(^|/)(skills|agents|commands|prompts|references)/|^\.claude/'
          files=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq 'if (.files | length) >= 300 then empty else .files[].filename end') || files=""
          fi
          code=true
          if [ -n "$files" ]; then
            other=$(printf '%s\n' "$files" | grep -Ev "$docs_re" || true)
            kept=$(printf '%s\n' "$files" | grep -E "$docs_re" | grep -E "$keep_re" || true)
            if [ -z "$other" ] && [ -z "$kept" ]; then code=false; fi
          fi
          echo "Changed files:"; printf '%s\n' "$files" | head -50
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  unit-integration-golden:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 on PR; full matrix on tag releases. Was [3.11, 3.12] on every
        # PR; doubled minutes without catching anything PRs were breaking.
        python-version: ${{ github.event_name == 'pull_request' && fromJson('["3.12"]') || fromJson('["3.11", "3.12"]') }}
    steps:
      - uses: actions/checkout@v6
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
        if: needs.changes.outputs.code == 'true'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
        if: needs.changes.outputs.code == 'true'
      - name: Unit + integration + golden + stress tests
        run: pytest tests/unit tests/integration tests/golden tests/stress -v --cov=agentsuite --cov-report=term-missing
        if: needs.changes.outputs.code == 'true'

  cleanroom:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run cleanroom (mocked LLM)
        run: bash scripts/run-cleanroom.sh

  wheel-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build wheel
        run: python -m build
      - name: Install wheel in fresh venv
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install dist/*.whl
      - name: Import check
        run: |
          .venv-smoke/bin/python -c "import importlib; [importlib.import_module(m) for m in ['agentsuite.agents.founder.prompt_loader','agentsuite.agents.design.prompt_loader','agentsuite.agents.product.prompt_loader','agentsuite.agents.engineering.prompt_loader','agentsuite.agents.marketing.prompt_loader','agentsuite.agents.trust_risk.prompt_loader','agentsuite.agents.cio.prompt_loader']]"
      - name: Console script — agentsuite --help
        run: .venv-smoke/bin/agentsuite --help
      - name: Install mcp extra for agentsuite-mcp smoke test
        run: .venv-smoke/bin/pip install mcp>=1.0
      - name: Console script — agentsuite-mcp --help
        run: .venv-smoke/bin/agentsuite-mcp --help
